version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0
    labels:
      - "dependabot"
      - "dependencies"
      - "maintenance"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
